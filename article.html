  <body class="pricing-page article-page">

    <main>

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const root = document.getElementById('article-root');
        const params = new URLSearchParams(window.location.search);
        const slug = params.get('slug');

        function escapeHtml(value) {
          return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
        }

        function formatDate(value) {
          if (!value) return '';
          const date = new Date(`${value}T00:00:00`);
          if (Number.isNaN(date.getTime())) return value;
          return date.toLocaleDateString(undefined, {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
          });
        }

        function renderBlock(block) {
          if (block.type === 'heading') {
            return `<h2>${escapeHtml(block.text)}</h2>`;
          }

          if (block.type === 'list') {
            const items = (block.items || [])
              .map((item) => `<li>${escapeHtml(item)}</li>`)
              .join('');
            return `<ul>${items}</ul>`;
          }

          return `<p>${escapeHtml(block.text)}</p>`;
        }

        function renderArticle(article, relatedArticles) {
          document.title = `${article.title} | Invenie Blog`;
          const metaDescription = document.querySelector('meta[name="description"]');
          if (metaDescription) metaDescription.setAttribute('content', article.summary || 'Read practical inventory management insights from Invenie.');

          root.className = 'article-content-wrap';
          root.innerHTML = `
            <header class="article-header">
              <span class="resource-tag">${escapeHtml(article.category)}</span>
              <h1>${escapeHtml(article.title)}</h1>
              <p>${escapeHtml(article.summary)}</p>
              <div class="article-meta">
                <span>${escapeHtml(formatDate(article.publishedDate))}</span>
                <span>${escapeHtml(article.readTime)}</span>
              </div>
            </header>
            <div class="article-layout">
              <div class="article-content">
                ${(article.content || []).map(renderBlock).join('')}
              </div>
              <aside class="article-sidebar">
                <div class="article-sidebar-card">
                  <span class="resource-tag">Key points</span>
                  <ul>
                    ${(article.highlights || []).map((item) => `<li>${escapeHtml(item)}</li>`).join('')}
                  </ul>
                </div>
                <div class="article-sidebar-card">
                  <span class="resource-tag">Related reads</span>
                  <div class="article-related-list">
                    ${relatedArticles.map((item) => `
                      <a href="article.html?slug=${encodeURIComponent(item.slug)}">
                        <strong>${escapeHtml(item.title)}</strong>
                        <small>${escapeHtml(item.category)}</small>
                      </a>
                    `).join('')}
                  </div>
                </div>
              </aside>
            </div>
          `;
        }

        function renderNotFound() {
          root.className = 'article-error';
          root.innerHTML = `
            <span class="resource-tag">Article not found</span>
            <h1>We could not find that article.</h1>
            <p>The blog post may have moved, or the link may be missing a valid slug.</p>
            <a class="pricing-button" href="blog.html">Back to Blog</a>
          `;
        }

        fetch('blog-posts.json')
          .then((response) => {
            if (!response.ok) throw new Error('Unable to load article content.');
            return response.json();
          })
          .then((data) => {
            const articles = Array.isArray(data.articles) ? data.articles : [];
            const article = articles.find((item) => item.slug === slug);

            if (!article) {
              renderNotFound();
              return;
            }

            const related = articles
              .filter((item) => item.slug !== article.slug)
              .slice(0, 3);

            renderArticle(article, related);
          })
          .catch(() => {
            root.className = 'article-error';
            root.innerHTML = `
              <span class="resource-tag">Content unavailable</span>
              <h1>We could not load the article content.</h1>
              <p>Please open this page through a local web server or your deployed site so the JSON content file can be loaded.</p>
              <a class="pricing-button" href="blog.html">Back to Blog</a>
            `;
          });
      });
    </script>
    <script defer src="https://kit.fontawesome.com/8e98006f77.js" crossorigin="anonymous"></script>
  </body>
</html>
