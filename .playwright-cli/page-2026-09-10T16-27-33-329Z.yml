        - generic [ref=e175]:
          - paragraph [ref=e176]: Questions
          - heading "Practical answers before you choose." [level=2] [ref=e177]
        - paragraph [ref=e178]: If you are between two plans, pick the one that matches the workflow you need today. You can upgrade as operations grow.
      - generic [ref=e179]:
        - article [ref=e180]:
          - heading "Which plan should a single shop start with?" [level=3] [ref=e181]
          - paragraph [ref=e182]: Starter is free forever for up to 50 inventory items, one owner, and one location. It includes core inventory, stock-in, sales, low-stock visibility, a basic dashboard, and basic sales history. No credit card required.
        - article [ref=e183]:
          - heading "When should I choose Growth?" [level=3] [ref=e184]
          - paragraph [ref=e185]: Choose Growth when staff accountability, suppliers, stock adjustment approvals, notifications, audit trail, and operational dashboard matter.
        - article [ref=e186]:
          - heading "Does Starter use up my paid-plan trial?" [level=3] [ref=e187]
          - paragraph [ref=e188]: No. Starter is not a trial. Businesses without previous paid subscriptions or paid-plan trials may qualify for a 14-day trial on their first paid monthly plan. Annual paid plans do not include a trial.
        - article [ref=e189]:
          - heading "Is Storefront included?" [level=3] [ref=e190]
          - paragraph [ref=e191]: Storefront is Coming Soon in Invenie?s App/Plugin Store. Its future pricing and plan availability have not been decided.
        - article [ref=e192]:
          - heading "Which plan supports branches?" [level=3] [ref=e193]
          - paragraph [ref=e194]: Full Operations is the branch-ready plan. It includes multiple locations, requisitions, issuance, receiving, inter-branch movement, and branch dashboards.
        - article [ref=e195]:
          - heading "Do annual plans include a discount?" [level=3] [ref=e196]
          - paragraph [ref=e197]: Yes. Growth and Full Operations cost 10% less annually than 12 monthly payments. Starter stays free forever and has no annual billing.
